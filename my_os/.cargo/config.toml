[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "x86_64-unknown-none"
# 以下の行を追加（住所の衝突を防ぐ魔法の引数）
rustflags = ["-C", "link-arg=-Ttext=0x400000"]

[target.'cfg(all(any(target_arch = "x86_64", target_arch = "x86"), target_os = "none"))']
runner = "bootimage runner"
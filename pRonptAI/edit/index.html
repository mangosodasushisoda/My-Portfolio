<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pRomptAIeditor-MVP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="ai-window">
            <h2>🤖 AI先生の相談室</h2>
            <div id="responseAIDiv"></div>
            <input type="text" id="myInput" placeholder="AIに命令してね...">
        </div>

        <div class="editor-window">
            <h1 style="margin-bottom: 10px; font-weight: bold;">📝 コードエディタ</h1>
            <textarea id="codeEditor" placeholder="ここにコードを書いてね..."></textarea>
            <div class="button-group">
                <button id="runButton">▶ 実行</button>
                <button id="stopButton">■ 停止</button>
                <button id="compileButton">▲ コンパイル</button>
            </div>
        </div>

        <div class="stage-window">
            <div id="canvas-section">
                <canvas id="myCanvas" width="480" height="360"></canvas>
            </div>
            <div id="terminal-section">
                <div id="responseDiv"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
